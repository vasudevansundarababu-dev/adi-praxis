# Builds the three images for the demo environment on Cloud Build (linux/amd64).
# Substitutions: _REPO (Artifact Registry path), _TAG, _API_URL (the praxis-api Cloud Run URL).
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_REPO}/api:${_TAG}', '.']
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'apps/web/Dockerfile', '--build-arg', 'API_BASE_URL=${_API_URL}', '-t', '${_REPO}/web:${_TAG}', '.']
  - id: candidate
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'apps/candidate/Dockerfile', '--build-arg', 'API_BASE_URL=${_API_URL}', '-t', '${_REPO}/candidate:${_TAG}', '.']
images:
  - '${_REPO}/api:${_TAG}'
  - '${_REPO}/web:${_TAG}'
  - '${_REPO}/candidate:${_TAG}'
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
