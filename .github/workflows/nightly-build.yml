# Nightly build (02:00 IST, after the defect agent): if main changed since the last nightly, run all tests, deploy to
# the TEST environment (real Claude on Vertex; simulated sign-in, identity check and email), smoke-test it, publish a
# GitHub pre-release "nightly-YYYYMMDD-<sha>" with release notes, and ask testers to verify each fixed issue.
#
# Needs repository variables TEST_GCP_PROJECT, TEST_WIF_PROVIDER, TEST_DEPLOYER_SA (infra/test/setup-github-access.sh).
name: Nightly build
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if main has not changed since the last nightly
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  pull-requests: read
  id-token: write
concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  changes:
    if: vars.TEST_GCP_PROJECT != ''
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
      previous: ${{ steps.c.outputs.previous }}
      label: ${{ steps.c.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          prev=$(git tag --list 'nightly-*' --sort=-creatordate | head -1)
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "label=nightly-$(TZ=Asia/Kolkata date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ -z "$prev" ] || [ "$(git rev-parse "$prev^{commit}")" != "$(git rev-parse HEAD)" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change on main since $prev; nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [changes, ci]
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 60
    env:
      LABEL: ${{ needs.changes.outputs.label }}
      PROJECT: ${{ vars.TEST_GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gcp-auth
        with:
          provider: ${{ vars.TEST_WIF_PROVIDER }}
          service_account: ${{ vars.TEST_DEPLOYER_SA }}
          region: ${{ env.REGION }}
      - name: Build, migrate and deploy to the test environment
        env:
          DEPLOY_ONLY: '1'
          PRAXIS_VERTEX: '1'
          PRAXIS_ENV_LABEL: Test environment
          PRAXIS_BUILD: ${{ env.LABEL }}
        run: infra/demo/deploy-demo.sh "$PROJECT" unused "$REGION"
      - name: Smoke test
        run: |
          PNUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          API=https://praxis-api-$PNUM.$REGION.run.app
          curl -fsS "$API/readyz"
          test "$(curl -fsS "$API/api/v1/version" | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')" = "$LABEL"
          for app in web candidate; do curl -fsS -o /dev/null "https://praxis-$app-$PNUM.$REGION.run.app/"; done
          echo "Smoke test passed for $LABEL" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [changes, deploy]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LABEL: ${{ needs.changes.outputs.label }}
      PREV: ${{ needs.changes.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes and verification requests
        run: |
          range=${PREV:+$PREV..}HEAD
          {
            echo "Deployed to the **test environment** on $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST'). Build \`$LABEL\`."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' $range | head -200
          } > notes.md
          # Issues fixed in this build: pull requests merged since the last nightly that say "Issue: #N".
          issues=$(git log --format='%B' $range | grep -oiE '(issue|refs|fixes|closes):? #[0-9]+' | grep -oE '[0-9]+' | sort -un || true)
          for pr in $(git log --format='%s' $range | grep -oE '\(#[0-9]+\)' | grep -oE '[0-9]+' | sort -un); do
            body=$(gh pr view "$pr" -R "$REPO" --json body -q .body 2>/dev/null || true)
            issues="$issues $(echo "$body" | grep -oiE 'issue:? #[0-9]+' | grep -oE '[0-9]+' || true)"
          done
          issues=$(echo $issues | tr ' ' '\n' | sort -un | tr '\n' ' ')
          if [ -n "${issues// }" ]; then
            { echo; echo "## Please verify"; for n in $issues; do echo "- #$n"; done; } >> notes.md
          fi
          git tag "$LABEL" HEAD && git push origin "$LABEL"
          gh release create "$LABEL" -R "$REPO" --prerelease --title "$LABEL" --notes-file notes.md
          for n in $issues; do
            state=$(gh issue view "$n" -R "$REPO" --json state -q .state 2>/dev/null || echo NONE)
            [ "$state" = "OPEN" ] || continue
            gh issue edit "$n" -R "$REPO" --add-label status:ready-to-verify --remove-label agent:pr-open,status:reopened || true
            gh issue comment "$n" -R "$REPO" --body "The fix is in build **$LABEL**, now on the test environment. Please retest and comment \`/verified\` if it works or \`/failed\` with what you saw."
          done
