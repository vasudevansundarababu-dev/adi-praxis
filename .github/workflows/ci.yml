# Pull requests: typecheck, unit and integration tests (real Postgres + Redis via docker compose, as locally),
# Playwright smoke tests, container builds, and `terraform plan` when infrastructure changes.
name: CI
on:
  pull_request:
  workflow_call:
  # The nightly agent starts CI on its branches (pull requests opened with the workflow token do not trigger CI).
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a pull request's changed files
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04); unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client (typecheck and tests need its types)
        run: pnpm --filter @praxis/api db:generate
      - name: Start Postgres (pgvector), Redis, Mailpit and the GCS emulator
        run: docker compose up -d --wait
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env:
          CI: 'true'
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: UI smoke tests
        run: pnpm test:e2e
        env:
          PW_CHANNEL: ''
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/terraform/**'

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        working-directory: infra/terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false -input=false && terraform validate
      - name: Authenticate (read-only planner)
        # Plans need the environment's Workload Identity variables; until they exist, fmt and validate still run.
        if: github.event.pull_request.head.repo.full_name == github.repository && (matrix.env == 'staging' && vars.GCP_WIF_PROVIDER_STAGING || matrix.env == 'production' && vars.GCP_WIF_PROVIDER_PRODUCTION)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.env == 'staging' && vars.GCP_WIF_PROVIDER_STAGING || vars.GCP_WIF_PROVIDER_PRODUCTION }}
          service_account: ${{ matrix.env == 'staging' && vars.GCP_PLANNER_SA_STAGING || vars.GCP_PLANNER_SA_PRODUCTION }}
      - name: Plan
        if: github.event.pull_request.head.repo.full_name == github.repository && (matrix.env == 'staging' && vars.GCP_WIF_PROVIDER_STAGING || matrix.env == 'production' && vars.GCP_WIF_PROVIDER_PRODUCTION)
        working-directory: infra/terraform/envs/${{ matrix.env }}
        env:
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_domains: ${{ matrix.env == 'staging' && vars.DOMAINS_STAGING || vars.DOMAINS_PRODUCTION }}
        run: terraform init -input=false && terraform plan -input=false -lock-timeout=5m -no-color
