# Release tag: manual approval (the "production" GitHub environment requires reviewers), migrations, new revisions
# with no traffic, 10% canary with smoke tests, then 100% together with the worker and the grading job.
#
# Rollback (infra/deploy/cloud-run-state.sh): what production runs is recorded BEFORE anything changes, and a failure
# restores exactly that, and only what this run actually changed (job images after a failed migration, traffic only
# once the canary started, the worker and grading job only once they were switched).
name: Release production
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT: ${{ vars.GCP_PROJECT_PRODUCTION }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    if: vars.GCP_PROJECT_PRODUCTION != ''
    # Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04); unpin after upgrading Playwright.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gcp-auth
        with:
          provider: ${{ vars.GCP_WIF_PROVIDER_PRODUCTION }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_PRODUCTION }}
          region: ${{ env.REGION }}
      - name: Record what production runs now (the rollback target)
        run: infra/deploy/cloud-run-state.sh record "$RUNNER_TEMP/prod-state"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push images
        run: |
          REG="$REGION-docker.pkg.dev/$PROJECT/praxis"
          for app in api web candidate; do
            docker buildx build --push -f "apps/$app/Dockerfile" -t "$REG/$app:$TAG" -t "$REG/$app:$GITHUB_SHA" .
          done
          docker buildx build --push -f infra/harbor-verify/Dockerfile -t "$REG/harbor-verify:$TAG" -t "$REG/harbor-verify:$GITHUB_SHA" .
      - name: Migrations (backward-compatible for one release)
        run: |
          echo "JOBS_CHANGED=1" >> "$GITHUB_ENV"
          REG="$REGION-docker.pkg.dev/$PROJECT/praxis"
          gcloud run jobs update praxis-migrate --region "$REGION" --image "$REG/api:$TAG"
          gcloud run jobs update praxis-verify-chains --region "$REGION" --image "$REG/api:$TAG"
          gcloud run jobs execute praxis-migrate --region "$REGION" --wait
          # The grading job (praxis-harbor-verify) switches with the worker, its main caller, at promotion (below).
      - name: Deploy new revisions without traffic
        run: |
          REG="$REGION-docker.pkg.dev/$PROJECT/praxis"
          REV=$(echo "$TAG" | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          echo "REV=$REV" >> "$GITHUB_ENV"
          gcloud run deploy praxis-api       --region "$REGION" --image "$REG/api:$TAG"       --no-traffic --tag "rc-$REV"
          gcloud run deploy praxis-web       --region "$REGION" --image "$REG/web:$TAG"       --no-traffic --tag "rc-$REV"
          gcloud run deploy praxis-candidate --region "$REGION" --image "$REG/candidate:$TAG" --no-traffic --tag "rc-$REV"
          # The worker has no user traffic; it switches after the canary succeeds (see below).
      - name: 10% canary
        run: |
          echo "TRAFFIC_CHANGED=1" >> "$GITHUB_ENV"
          for s in praxis-api praxis-web praxis-candidate; do
            gcloud run services update-traffic "$s" --region "$REGION" --to-tags "rc-$REV=10"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Automatic smoke tests during the canary
        run: pnpm exec playwright test -c e2e
        env:
          PW_CHANNEL: ''
          E2E_WEB_URL: ${{ vars.E2E_WEB_URL }}
          E2E_CANDIDATE_URL: ${{ vars.E2E_CANDIDATE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PM_EMAIL: ${{ secrets.E2E_PM_EMAIL }}
          E2E_PM_PASSWORD: ${{ secrets.E2E_PM_PASSWORD }}
      - name: Promote to 100%
        run: |
          REG="$REGION-docker.pkg.dev/$PROJECT/praxis"
          for s in praxis-api praxis-web praxis-candidate; do
            gcloud run services update-traffic "$s" --region "$REGION" --to-tags "rc-$REV=100"
          done
          echo "WORKER_CHANGED=1" >> "$GITHUB_ENV"
          gcloud run deploy praxis-worker --region "$REGION" --image "$REG/api:$TAG"
          gcloud run jobs update praxis-harbor-verify --region "$REGION" --image "$REG/harbor-verify:$TAG"
      - name: Roll back to what was recorded if anything failed
        if: failure()
        run: |
          what=""
          [ -n "${TRAFFIC_CHANGED:-}" ] && what="$what services"
          [ -n "${WORKER_CHANGED:-}" ] && what="$what worker"
          [ -n "${JOBS_CHANGED:-}${WORKER_CHANGED:-}" ] && what="$what jobs"
          if [ -z "$what" ]; then echo "Nothing in production was changed; no rollback needed."; exit 0; fi
          infra/deploy/cloud-run-state.sh restore "$RUNNER_TEMP/prod-state" $what
