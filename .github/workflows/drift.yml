# Weekly drift check: nothing is created by hand, so any difference between Terraform and the projects fails here.
name: Terraform drift
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: vars.GCP_PROJECT_STAGING != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.env == 'staging' && vars.GCP_WIF_PROVIDER_STAGING || vars.GCP_WIF_PROVIDER_PRODUCTION }}
          service_account: ${{ matrix.env == 'staging' && vars.GCP_PLANNER_SA_STAGING || vars.GCP_PLANNER_SA_PRODUCTION }}
      - name: Plan (exit code 2 means drift)
        working-directory: infra/terraform/envs/${{ matrix.env }}
        env:
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_domains: ${{ matrix.env == 'staging' && vars.DOMAINS_STAGING || vars.DOMAINS_PRODUCTION }}
          # The operator's terraform.tfvars without app_secret_values (infra/README.md); a secret, so it stays out of the public repository.
          TFVARS: ${{ matrix.env == 'staging' && secrets.TFVARS_STAGING || secrets.TFVARS_PRODUCTION }}
        run: |
          if [ -n "$TFVARS" ]; then printf '%s\n' "$TFVARS" > ci.auto.tfvars; fi
          terraform init -input=false && terraform plan -input=false -lock=false -detailed-exitcode -no-color
