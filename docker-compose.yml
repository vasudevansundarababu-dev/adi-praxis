# Local development services for ADI Praxis.
# Host ports are offset (5442, 6389, 1035/8035) so they don't clash with other local stacks.
name: adi-praxis

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "127.0.0.1:${PRAXIS_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis -d praxis"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${PRAXIS_REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${PRAXIS_SMTP_PORT:-1035}:1025"
      - "127.0.0.1:${PRAXIS_MAILPIT_UI_PORT:-8035}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443", "-backend", "memory"]
    ports:
      - "127.0.0.1:${PRAXIS_GCS_PORT:-4443}:4443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
